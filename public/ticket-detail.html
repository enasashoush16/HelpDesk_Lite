<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket Detail - HelpDesk Lite</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-layout">
    <main class="main-content">
      <div class="page-header">
        <h1 id="ticket-title">Ticket Detail</h1>
        <p id="ticket-subtitle"></p>
      </div>
      <div class="detail-grid">
        <div class="card">
          <h2>Description</h2>
          <p class="detail-description" id="ticket-description"></p>
        </div>
        <div class="card">
          <h2>Details</h2>
          <div class="detail-meta" id="ticket-meta"></div>
          <div id="admin-controls" class="hidden">
            <hr style="margin:20px 0;border:none;border-top:1px solid var(--border)">
            <h2 style="margin-bottom:12px">Manage</h2>
            <div class="form-group">
              <label>Status</label>
              <select id="status-select"></select>
            </div>
            <div class="form-group">
              <label>Priority</label>
              <select id="priority-select"></select>
            </div>
            <div class="form-group">
              <label>Assign To</label>
              <select id="assign-select">
                <option value="">Unassigned</option>
              </select>
            </div>
            <button class="btn btn-primary" id="save-btn">Save Changes</button>
            <div id="save-msg" class="form-success hidden mt-16"></div>
          </div>
        </div>
      </div>
      <a href="#" id="back-link" class="btn btn-secondary mt-16">← Back</a>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/ticket-detail.js"></script>
</body>
</html>
