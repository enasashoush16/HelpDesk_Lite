<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Dashboard - HelpDesk Lite</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-layout">
    <main class="main-content">
      <div class="page-header">
        <h1>Manager Dashboard</h1>
        <p>Company-wide visibility and reporting</p>
      </div>
      <div class="cards-grid" id="kpi-cards"></div>
      <div class="charts-grid">
        <div class="card">
          <h2>Tickets by Status</h2>
          <div class="chart-container"><canvas id="chart-status"></canvas></div>
        </div>
        <div class="card">
          <h2>Tickets by Category</h2>
          <div class="chart-container"><canvas id="chart-category"></canvas></div>
        </div>
        <div class="card">
          <h2>Tickets by Assignee</h2>
          <div class="chart-container"><canvas id="chart-assignee"></canvas></div>
        </div>
      </div>
      <div class="card">
        <h2>Agent Workload</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Agent</th><th>Assigned Tickets</th><th>In Progress</th><th>Completed</th>
              </tr>
            </thead>
            <tbody id="workload-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/manager.js"></script>
  <script>initLayout('manager', 'manager');</script>
</body>
</html>
